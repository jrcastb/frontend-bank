<main class="app-root">
  @if (currentError(); as currentErrorState) {
    <section class="alert" role="alert" aria-live="assertive">
      <div>
        <strong>{{ currentErrorState.title }}</strong>
        <p>{{ currentErrorState.message }}</p>
      </div>
      <button type="button" (click)="dismissError()" aria-label="Descartar mensaje de error">
        Cerrar
      </button>
    </section>
  }

  <section class="app-root__content">
    <router-outlet />
  </section>
</main>
