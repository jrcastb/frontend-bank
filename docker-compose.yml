services:
  mysql:
    image: mysql:8.4
    container_name: bank-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-backend_bank}
      MYSQL_USER: ${MYSQL_USER:-backend_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-backend_pass}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_pass}
      MYSQL_INITDB_SKIP_TZINFO: "yes"
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER:-backend_user}", "-p${MYSQL_PASSWORD:-backend_pass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - bank-network

  backend-bank:
    build:
      context: ${BACKEND_CONTEXT:-../backend-bank}
      dockerfile: Dockerfile
      args:
        GRADLE_VERSION: 8.14.3
    image: backend-bank:latest
    container_name: backend-bank-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SERVER_PORT: 8080
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-backend_bank}
      MYSQL_USER: ${MYSQL_USER:-backend_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-backend_pass}
      SECURITY_USER: ${SECURITY_USER:-admin}
      SECURITY_PASSWORD: ${SECURITY_PASSWORD:-admin123}
      JAVA_OPTS: "-Xmx512m -Xms256m"
    ports:
      - "8080:8080"
    networks:
      - bank-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: frontend-bank:local
    container_name: frontend-bank
    restart: unless-stopped
    depends_on:
      backend-bank:
        condition: service_healthy
    environment:
      BACKEND_URL: ${BACKEND_URL:-http://backend-bank:8080}
    ports:
      - "4200:80"
    networks:
      - bank-network

volumes:
  mysql_data:
    driver: local

networks:
  bank-network:
    driver: bridge
